  - id: "1.2"
    caption: "Categories of Software Requirements"
    page: 4
    image: "figures/figure-1-2.jpg"
    description: >-
      Classification of software requirements and the relationships among the
      categories. Software Requirements split into Software Project Requirements
      and Software Product Requirements. Software Product Requirements are further
      divided into Functional Requirements and Nonfunctional Requirements;
      Nonfunctional Requirements are subdivided into Technology Constraints and
      Quality of Service Constraints.
    mermaid: |
      flowchart TD
        SR["Software Requirements"]
        SR --> PJ["Software Project Requirements"]
        SR --> PD["Software Product Requirements"]
        PD --> FN["Functional Requirements"]
        PD --> NF["Nonfunctional Requirements"]
        NF --> TC["Technology Constraints"]
        NF --> QS["Quality of Service Constraints"]

  - id: "1.3"
    caption: "Software Requirements Activities"
    page: 6
    image: "figures/figure-1-3.jpg"
    description: >-
      The requirements activities. Requirements work comprises Requirements
      Development — reaching agreement on what software is to be constructed,
      consisting of Elicitation, Analysis, Specification and Validation — and
      Requirements Management — maintaining that agreement over time, consisting
      of Scrubbing, Change Control and Scope Matching.
    mermaid: |
      flowchart TD
        R["Requirements"]
        R --> D["Requirements Development"]
        R --> G["Requirements Management"]
        D --> D1["Elicitation"]
        D --> D2["Analysis"]
        D --> D3["Specification"]
        D --> D4["Validation"]
        G --> G1["Scrubbing"]
        G --> G2["Change Control"]
        G --> G3["Scope Matching"]

  - id: "1.4"
    caption: "Value as a Function of Level of Performance"
    page: 9
    image: "figures/figure-1-4.jpg"
    description: >-
      A plot of Value (vertical axis) against Level of Performance (horizontal
      axis), with no numeric scale — it shows a relationship, not data. The value
      curve is S-shaped: it stays low and nearly flat at low performance, rises
      steeply as performance increases, then levels off into a plateau at high
      performance. Two points are marked on the curve. The "Fail" point is at the
      lower knee: the least-favourable performance level, below which reducing
      performance further yields essentially no further loss of value. The
      "Perfection" point is at the upper knee: the most-favourable level, beyond
      which higher performance adds essentially no further value. This depicts a
      quality-of-service constraint whose value increases with performance (e.g.,
      capacity, throughput, reliability); for constraints whose value decreases
      as performance increases (e.g., response time, mean time to repair), the
      same curve is mirrored.
    mermaid: null

  - id: "1.5"
    caption: "Most Cost-Effective Level of Performance"
    page: 9
    image: "figures/figure-1-5.jpg"
    description: >-
      A plot of two quantities measured in money ($, vertical axis) against Level
      of Performance (horizontal axis), with no numeric scale. One curve is
      Value: an S-shape that is low at low performance, rises steeply in the
      middle, and plateaus at high performance (the same shape as Figure 1.4).
      The other curve is Cost to deliver: a rising step function — cost stays
      flat, then jumps up to a higher level, then jumps again — because each
      increment of achievable performance requires a discrete jump in investment.
      The marked "most cost-effective level of performance" is the point on the
      horizontal axis where the vertical distance between Value and Cost (value
      minus cost) is greatest, i.e., where net benefit is maximised.
    mermaid: null

  - id: "1.6"
    caption: "Example of Structured Natural Language Specification for a Single Use Case"
    page: 12
    image: "figures/figure-1-6.jpg"
    description: |-
      An example of a structured natural language requirements specification for a
      single use case (use case #66, "Reserve flight(s)"). The template captures
      the following fields:

      | Field | Content |
      |---|---|
      | Use case name | Reserve flight(s) |
      | Triggering event(s) | Customer requests reservation(s) on flight(s) |
      | Parameters | Passenger, itinerary, fare class, payment method(s) |
      | Requires | Legal itinerary, fare class restrictions met |
      | Guarantees | Seat(s) reserved for passenger on itinerary flight(s) |
      | Normal course | Non-FF passenger, all domestic itinerary, Economy fare class, credit/debit card |
      | Alternative course(s) | FF passenger [None, Silver, Gold, Platinum, Elite]; Itinerary [all international, mixed domestic + international]; Fare class [Basic economy, Premium Economy, Business, First]; Payment method [Voucher, FF miles] |
      | Exceptions | C/D card declined, voucher doesn't exist, voucher expired, FF account doesn't exist, insufficient miles in FF account |
    mermaid: null
