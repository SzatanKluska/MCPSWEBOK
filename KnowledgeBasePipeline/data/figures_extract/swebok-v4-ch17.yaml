# Figure-crop geometry for SWEBOK v4.0, Chapter 17 "Mathematical Foundations".
#
# Consumed by kbprep.figures.extract to crop each Figure N.M out of the
# source PDF into KnowledgeBase/figures/figure-N-M.jpg. `page` is 0-based.
# `column` is left|right|full (which half of a two-column page the figure
# sits in). `top` bounds the crop's top edge: header (below the running
# header), top (page top), or after:<fig_id> (below a preceding figure on
# the same page).

figures:
  - id: "17.1"
    page: 1
    column: full
    top: top
  - id: "17.2"
    page: 4
    column: left
    top: top
  - id: "17.3"
    page: 4
    column: right
    top: top
  - id: "17.4"
    page: 5
    column: left
    top: top
  - id: "17.5"
    page: 5
    column: left
    top: "after:17.4"
  - id: "17.6"
    page: 5
    column: right
    top: top
  - id: "17.7"
    page: 6
    column: right
    top: top
  - id: "17.8"
    page: 7
    column: left
    top: top
  - id: "17.9"
    page: 7
    column: left
    top: "after:17.8"
  - id: "17.10"
    page: 7
    column: left
    top: "after:17.9"
  - id: "17.11"
    page: 7
    column: left
    top: "after:17.10"
  - id: "17.12"
