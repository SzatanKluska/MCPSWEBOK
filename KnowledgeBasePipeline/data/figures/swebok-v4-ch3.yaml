      flowchart LR
        SD["Software Design"]
        SD --> F["1. Software Design Fundamentals"]
        SD --> P["2. Software Design Processes"]
        SD --> Q["3. Software Design Qualities"]
        SD --> R["4. Recording Software Design"]
        SD --> S["5. Software Design Strategies and Methods"]
        SD --> A["6. Software Design Analysis and Evaluations"]
        F --> F1["Design Thinking"]
        F --> F2["Context of Software Design"]
        F --> F3["Key Issues in Software Design"]
        F --> F4["Software Design Principles"]
        P --> P1["High-Level Design"]
        P --> P2["Detailed Design"]
        Q --> Q1["Concurrency"]
        Q --> Q2["Control and Event Handling"]
        Q --> Q3["Data Persistence"]
        Q --> Q4["Distribution of Components"]
        Q --> Q5["Errors and Exception Handling"]
        Q --> Q6["Integration and Interoperability"]
        Q --> Q7["Assurance, Security, Safety"]
        Q --> Q8["Variability"]
        R --> R1["Model-Based Design"]
        R --> R2["Structural Design Description"]
        R --> R3["Behavioral Design Description"]
        R --> R4["Design Patterns"]
        R --> R5["Specialized Domain-Specific Languages"]
        R --> R6["Design Rationale"]
        S --> S1["General Strategies"]
        S --> S2["Function-Oriented"]
        S --> S3["Data-Centered"]
        S --> S4["Object-Oriented"]
        S --> S5["User-Centered"]
        S --> S6["Component-Based"]
        S --> S7["Event-Driven"]
