# Figure definitions for SWEBOK v4.0, Chapter 3 "Software Design".
#
# Authored content that the RAG pipeline turns into figures.jsonl (a side
# lookup, NOT part of the embedded search index). The MCP server attaches these
# to search hits whose text references the figure (Option B: join by reference).
#
# `image` is relative to this file's directory (provenance only). `mermaid` is
# null for figures that are quantitative graphs, screenshots, or list/tabular
# content, which a diagram grammar cannot faithfully represent; those rely on
# `description` alone.

figures:
  - id: "3.1"
    caption: "Breakdown of topics for the Software Design KA"
    page: 2
    image: "figures/figure-3-1.jpg"
    description: >-
      Hierarchical breakdown of the Software Design Knowledge Area into its
      six top-level topics and their subtopics: (1) Software Design
      Fundamentals, (2) Software Design Processes, (3) Software Design
      Qualities, (4) Recording Software Design, (5) Software Design
      Strategies and Methods, and (6) Software Design Analysis and
      Evaluations. Each top-level topic decomposes into the subtopics covered
      in this KA.
