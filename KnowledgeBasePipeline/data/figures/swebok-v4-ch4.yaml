        P --> P6["Construction Quality"]
        P --> P7["Integration"]
        P --> P8["Cross-Platform Development and Migration"]
        T --> T1["API Design and Use"]
        T --> T2["Object-Oriented Runtime Issues"]
        T --> T3["Parameterization, Templates and Generics"]
        T --> T4["Assertions, Design by Contract and Defensive Programming"]
        T --> T5["Error Handling, Exception Handling and Fault Tolerance"]
        T --> T6["Executable Models"]
