      its five top-level topics and their subtopics: (1) Software
      Construction Fundamentals, (2) Managing Construction, (3) Practical
      Considerations, (4) Construction Technologies, and (5) Software
      Construction Tools. Each top-level topic decomposes into the subtopics
      covered in this KA; Construction Technologies has by far the most
      subtopics.
