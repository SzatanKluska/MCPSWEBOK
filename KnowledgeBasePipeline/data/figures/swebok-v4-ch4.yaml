        SC["Software Construction"]
        SC --> F["1. Software Construction Fundamentals"]
        SC --> M["2. Managing Construction"]
        SC --> P["3. Practical Considerations"]
        SC --> T["4. Construction Technologies"]
        SC --> O["5. Software Construction Tools"]
