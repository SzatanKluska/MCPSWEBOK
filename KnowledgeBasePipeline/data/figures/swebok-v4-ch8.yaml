  - id: "8.2"
    caption: "Example of reported relationships"
    page: 8
    image: "figures/figure-8-2.jpg"
    description: |-
      A worked example of tracking configuration item (CI) relationships,
      combining a small relationship diagram with three record tables.

      The diagram shows three CIs — CI-1, CI-2, CI-3 — and their relationships:
      each CI has a reflexive "succession" relationship with itself (drawn as a
      loop back onto the same node, since each version change creates a new
      succession record for that CI); CI-2 has a "dependency" relationship
      pointing to CI-1; and CI-3 has a "derivation" relationship pointing to
      CI-1 (CI-3 derives from CI-1).

      Successions Records — the date each CI was created (first three rows),
      and a change made to CI-1 on 10/05/2021 that created new version 2 from
      current version 1 (fourth row):

      | CI Code | Current Version | Next Version | Date |
      |---|---|---|---|
      | CI-1 | – | 1 | 10/01/2021 |
      | CI-2 | – | 1 | 10/04/2021 |
      | CI-3 | – | 1 | 10/03/2021 |
      | CI-1 | 1 | 2 | 10/05/2021 |

      Dependency Record — CI-1 and CI-2 have a dependency relationship created
      the day CI-2 was developed:

      | From CI | To CI | Date |
      |---|---|---|
      | CI-1 | CI-2 | 10/04/2021 |

      Derivation Record — CI-3 derives from CI-1, a relationship that came up
      the day CI-3 was created:

      | From CI | To CI | Date |
      |---|---|---|
      | CI-3 | CI-1 | 10/03/2021 |
    mermaid: |
      flowchart LR
        CI1["CI-1"]
        CI2["CI-2"]
        CI3["CI-3"]
        CI1 -->|succession| CI1
        CI2 -->|succession| CI2
        CI3 -->|succession| CI3
        CI2 -->|dependency| CI1
        CI3 -->|derivation| CI1

  - id: "8.3"
    caption: "Flow of a Change Control Process"
    page: 9
    image: "figures/figure-8-3.jpg"
    description: >-
      Flowchart of a change control process. It starts at "Need for Change"
      and flows to "Change identified for controlled item", then to "SCR
      Generated or Upgraded", then to a decision "SCR Evaluated": if
      Incomplete, it loops back to "Change identified for controlled item";
      if Complete, it proceeds to "Preliminary Investigation", then to a
      decision "CCB Review": if Rejected, it goes to "Inform Requester"
      (terminal); if Approved, it goes to "Assign to Software Engineer" and
      then to "Schedule, Design, Test, Complete Change" (terminal). A separate
      note box, not connected to the flow by an arrow, states that an
      "Emergency Path" usually also exists, where changes can be implemented
      with the change process performed afterward.
    mermaid: |
      flowchart TD
        Need(["Need for Change"])
        Need --> Change["Change identified for controlled item"]
        Change --> SCR["SCR Generated or Upgraded"]
        SCR --> Eval{"SCR Evaluated"}
        Eval -->|Incomplete| Change
        Eval -->|Complete| Prelim["Preliminary Investigation"]
        Prelim --> CCB{"CCB Review"}
        CCB -->|Rejected| Inform["Inform Requester"]
        CCB -->|Approved| Assign["Assign to Software Engineer"]
        Assign --> Sched["Schedule, Design, Test, Complete Change"]
