        M3 --> M3b["SCM Resources and Schedules"]
        M3 --> M3c["Tool Selection and Implementation"]
        M3 --> M3d["Vendor/Subcontractor Control"]
        M3 --> M3e["Interface Control"]
        M --> M4["SCM Plan"]
        M --> M5["Surveillance of Software Configuration"]
        M5 --> M5a["Management SCM Measures and Measurement"]
        M5 --> M5b["In-Process Audits of SCM"]
        I --> I1["Identifying Items to be Controlled"]
        I1 --> I1a["Software Configuration"]
        I1 --> I1b["Software Configuration Item"]
        I --> I2["Configuration Item Identifiers and Attributes"]
